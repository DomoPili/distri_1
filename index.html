<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Proyecto 8vo P_Distrib</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Bienvenido</h2>
        <input type="text" id="user" placeholder="Usuario (admin)">
        <input type="password" id="pass" placeholder="Contraseña (123)">
        <button id="btnLogin">Ingreso</button>
    </div>

    <script>
        document.getElementById('btnLogin').onclick = async function() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            
            try {
                // Estructura lista para cuando conectes tu microservicio real
                if(u === 'admin' && p === '123') {
                    localStorage.setItem('jwt_token', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.simulado');
                    window.location.href = 'buscar.html';
                } else {
                    throw new Error('Credenciales incorrectas');
                }
            } catch (error) {
                alert(error.message);
            }
        };
    </script>
</body>
</html>
